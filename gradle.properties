org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# JDK utilisé par Gradle : Gradle 9.7 refuse les JDK trop récents (ex. JDK 26).
# Si votre JDK système ne convient pas, lancez Gradle avec le JBR d'Android
# Studio : JAVA_HOME=/opt/android-studio/jbr ./gradlew ...
# ou décommentez la ligne ci-dessous (chemin propre à votre machine, ne pas committer).
# org.gradle.java.home=/opt/android-studio/jbr
