[versions]
# AGP 9.x : support Kotlin intégré (le plugin org.jetbrains.kotlin.android
# ne doit PAS être appliqué). Exige compileSdk 37 et Gradle 9.x.
agp = "9.3.2"
# Version du compilateur Kotlin embarqué dans AGP 9.3.2. Le module :core (JVM
# pur) applique org.jetbrains.kotlin.jvm à cette même version.
kotlin = "2.2.10"

androidx-core = "1.19.0"
androidx-activity = "1.13.0"
androidx-appcompat = "1.7.1"
androidx-recyclerview = "1.4.0"
androidx-constraintlayout = "2.2.1"
androidx-lifecycle = "2.9.4"
androidx-documentfile = "1.1.0"
androidx-preference = "1.2.1"
material = "1.13.0"
coroutines = "1.10.2"
junit5 = "5.13.4"
json = "20240303"

[libraries]
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidx-recyclerview" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "androidx-documentfile" }
androidx-preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "androidx-preference" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit5" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
json = { group = "org.json", name = "json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
